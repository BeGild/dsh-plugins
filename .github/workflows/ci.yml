name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # Required, not optional: the plugins import the official @deepseek-ai/*
      # packages, which are peerDependencies (supplied by the host at runtime)
      # and mirrored in devDependencies for exactly this purpose. Without an
      # install, the load/integration tests fail with ERR_MODULE_NOT_FOUND.
      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      - name: Plugin inventory
        run: node scripts/list.mjs

      # The gate: every hard rule from AGENTS.md, checked mechanically.
      # This is what most third-party plugins get rejected for.
      - name: Contract gate
        run: node scripts/validate.mjs

      - name: Tests
        run: node scripts/test-all.mjs
