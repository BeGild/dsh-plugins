# dsh-agentos-remote bundle patch
#
# Mounted exactly like dsh-sidebar-qa: the dsh.bundle.patch layer adds one
# Cordis plugin row to the profile stack. The service injects `webServer` — the
# QR login page rides the Web surface the user already reaches — so the profile
# must carry `dsh web` (or any bundle providing webServer). Agent services are
# NOT injected: `ctx.agents` is read when a task actually arrives, so a host
# without them still boots.
#
# ONE row serves both halves. This row is the host half (the link + the login
# routes); the browser half (lib/client.js, declared by `dsh.client` in
# package.json) is picked up from the same row by the client module system and
# adds the sidebar panel entry. No second row, and nothing to add here for it.
#
# Config (plain defaults merged by the plugin — all optional, no schema):
#   enabled        start the remote-control link on boot (default true)
#   endpoint       AgentOS API base (default https://tencent.sso.codebuddy.cn)
#   agentType      localAgentType sent to AgentOS (default "workbuddy": the
#                  server derives the channel namespace `copilot_<type>` from
#                  it, and the mobile app only enumerates copilot_workbuddy)
#   sessionFile    WorkBuddy session .info path override
#   workspaceDir   the DSH workspace exposed to the mobile app (default cwd)
#   deviceName     device name shown in the mobile app (default "{hostname}-DSH")
#   deviceId       conversation-sync device id (default: the plugin-owned
#                  ~/.workbuddy/.dsh-agentos-device-id, created if absent —
#                  NOT the desktop's device-id: sharing it collides two live
#                  processes into one registry identity). Override:
#                  DSH_AGENTOS_DEVICE_ID
#   provider       model route for app-driven sessions (default: host default)
#   model          model id for app-driven sessions (default: host default)
#   models         model list offered to the app's model picker. Each entry needs
#                  an `id`; `name` and `vendor` are displayed. `url` and `apiKey`
#                  are stripped before the list is sent. (default: none)
#   debug          publish a task-start event back to the app (default false)
- insert:
    - id: agentos-remote
      name: 'dsh-agentos-remote'
      config:
        enabled: !!js "process.env.DSH_AGENTOS_REMOTE_ENABLED !== 'false'"
        # Adds agentType/channelNamespace/registered/lastError to the status
        # route the panel and /agentos-remote/login/api/status read. Off unless
        # asked for: that route is unauthenticated.
        debug: !!js "process.env.DSH_AGENTOS_REMOTE_DEBUG === 'true'"
