# dsh-skill-menu — own the '/' candidate menu view.
#
# The browser half registers `conversation.input.overlay` under the stock
# cell id `slash-menu` depending only on the early `slots` service. Loaded
# ahead of dsh-web-app (bundle order; keep this bundle before
# '@deepseek-ai/dsh-web-app' in dsh.profile.bundles), that registration wins
# the cell and the stock MenuView never renders — while the stock trigger
# framework, its '/' source, and its skill tool row all keep running
# untouched. No official row is disabled and no official file is modified;
# removing this bundle restores the stock menu as-is.
#
# NOTE the ordering dependency: if this bundle loads after dsh-web-app, the
# stock MenuView wins the cell and this plugin's view silently never renders.
- insert:
    - id: dsh-skill-menu
      name: dsh-skill-menu
